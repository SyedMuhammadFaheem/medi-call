name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste phone numbers, Twilio credentials, or real medication details.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node.js version, OS, and how you run it (dev / systemd / other)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or call-log entries (redacted)
      render: shell
