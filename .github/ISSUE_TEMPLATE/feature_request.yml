name: Feature request
description: Suggest an improvement within the project's scope
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        medi-call is deliberately small. Please read the scope section of the README first; requests for
        multi-user support, LLM narration, or dose inference will be closed.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives considered
